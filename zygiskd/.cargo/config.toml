[build]
target-dir = "build/intermediates/rust"
# NOTE: The compile target is no longer pinned here. rust-android-gradle passes
# `--target` explicitly for every ABI listed in zygiskd/build.gradle.kts
# (arm64 -> aarch64-linux-android, x86_64 -> x86_64-linux-android).
# For a manual build use e.g.: cargo build --target x86_64-linux-android
