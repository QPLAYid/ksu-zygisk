name: CI

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    tags: [ v* ]
  pull_request:
  merge_group:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust toolchain
        run: |
          rustup override set nightly
          rustup target add aarch64-linux-android
          rustup target add x86_64-linux-android

      - name: Setup Ccache for faster builds
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ github.job }}-${{ runner.os }}-${{ hashFiles('**/build.gradle.kts', '**/gradle.properties') }}

      - name: Build with Gradle
        run: ./gradlew zipRelease zipDebug -Porg.gradle.parallel=true -Dorg.gradle.jvmargs=-Xmx2048m

      - name: Upload Release Zip
        uses: actions/upload-artifact@v4
        with:
          name: module-release
          path: module/build/outputs/release/*-release.zip

      - name: Upload Debug Zip
        uses: actions/upload-artifact@v4
        with:
          name: module-debug
          path: module/build/outputs/release/*-debug.zip
